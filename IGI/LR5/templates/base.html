<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервисный центр</title>
    <!-- Подключаем Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Навигационное меню -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">⚙️ IT-Сервис</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'services' %}">Услуги и цены</a>
                    </li>
                    {% if user.is_authenticated %}
    <li class="nav-item"><a class="nav-link text-info" href="{% url 'dashboard' %}">Личный кабинет</a></li>
    <li class="nav-item">
        <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-link nav-link text-danger">Выйти</button>
        </form>
    </li>
{% else %}
    <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Вход</a></li>
    <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Регистрация</a></li>
{% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент (сюда будут вставляться другие страницы) -->
    <main class="container my-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал сайта -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">© 2024 Сервисный центр. Все права защищены.</p>
        </div>
    </footer>

</body>
</html>
