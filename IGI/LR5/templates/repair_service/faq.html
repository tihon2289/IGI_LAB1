{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Часто задаваемые вопросы (Словарь терминов)</h2>
<div class="accordion" id="faqAccordion">
    {% for faq in faqs %}
    <div class="accordion-item">
        <h2 class="accordion-header" id="heading{{ faq.id }}">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ faq.id }}">
                <strong>{{ faq.question }}</strong> <span class="text-muted ms-3" style="font-size: 0.8rem;">({{ faq.created_at|date:"d.m.Y" }})</span>
            </button>
        </h2>
        <div id="collapse{{ faq.id }}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
            <div class="accordion-body">
                {{ faq.answer|linebreaks }}
            </div>
        </div>
    </div>
    {% empty %}
    <p>Список вопросов пока пуст.</p>
    {% endfor %}
</div>
{% endblock %}
