{% extends 'base.html' %}

{% block title %}Удаление услуги{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">🗑️ Подтверждение удаления</h3>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить услугу:</p>
                    <h4 class="text-danger">«{{ service.name }}»</h4>
                    
                    <div class="alert alert-warning mt-3">
                        <strong>Внимание!</strong> Это действие невозможно отменить.
                    </div>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'manage_services' %}" class="btn btn-secondary">
                                Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                Да, удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
